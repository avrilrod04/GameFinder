<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GameFinder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e2430;
      color: #e8ecf2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .caja-login {
      background: #2a3140;
      padding: 30px;
      border-radius: 12px;
      width: 300px;
    }
    h1 { margin-top: 0; text-align: center; }
    label { display: block; margin-top: 15px; }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #5b8def;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #mensaje { margin-top: 15px; text-align: center; }
    a { color: #9db8f5; display: block; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="caja-login">
    <h1>Iniciar sesión</h1>
    <form id="formulario-login">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" required>

      <label for="clave">Contraseña</label>
      <input type="password" id="clave" required>

      <button type="submit">Entrar</button>
    </form>
    <p id="mensaje"></p>
    <a href="index.html">← Volver al inicio</a>
  </div>

  <script>
    const formulario = document.getElementById("formulario-login");
    const mensaje = document.getElementById("mensaje");

    formulario.addEventListener("submit", function (evento) {
      evento.preventDefault();

      const usuario = document.getElementById("usuario").value;
      const clave = document.getElementById("clave").value;

      if (usuario === "admin" && clave === "1234") {
        sessionStorage.setItem("adminLogueado", "si");
        window.location.href = "admin.html";
      } else {
        mensaje.textContent = "Usuario o contraseña incorrectos ❌";
      }
    });
  </script>
</body>
</html>
